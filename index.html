<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SnapClone</title>

  <!-- PWABuilder / App Manifest Code -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fffc00">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>

  <!-- Snapchat Theme CSS -->
  <style>
    :root { --primary: #fffc00; --bg: #fff; --text: #111; --gray: #f9f9f9; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow: hidden; }
    .hidden { display: none !important; }
    
    /* Auth Screen */
    #authScreen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--primary); padding: 20px; }
    .auth-box { background: #fff; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .auth-box input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #ddd; border-radius: 12px; font-size: 16px; background: #f5f5f5;}
    .auth-box button { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .auth-box .toggle { margin-top: 15px; color: #555; text-decoration: underline; cursor: pointer; font-size: 14px; font-weight: 500; }
    
    /* App Layout */
    #app { display: flex; flex-direction: column; height: 100vh; background: var(--gray); }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #fff; border-bottom: 1px solid #eee; z-index: 10; }
    .avatar-btn { width: 40px; height: 40px; border-radius: 50%; background: #eee; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; cursor: pointer; color: #333; }
    .content { flex: 1; overflow-y: auto; position: relative; }
    .page { display: none; padding: 15px; height: 100%; }
    .page.active { display: block; }
    
    /* Nav Bar */
    .nav-bar { display: flex; justify-content: space-around; background: #000; padding: 15px 0; padding-bottom: env(safe-area-inset-bottom, 15px); }
    .nav-item { font-size: 26px; cursor: pointer; opacity: 0.5; transition: 0.2s; filter: grayscale(100%); }
    .nav-item.active { opacity: 1; transform: scale(1.15); filter: none; }
    
    /* Toast (Error/Success Messages) */
    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #111; color: #fff; padding: 12px 24px; border-radius: 25px; font-size: 14px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 9999; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    #toast.show { opacity: 1; top: 40px; }
    
    /* Lists & Cards */
    .grid { display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px; }
    .person-card, .story-card { background: #fff; padding: 15px; border-radius: 15px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #eee; }
    .person-card .avatar { width: 45px; height: 45px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
    .person-info { flex: 1; margin: 0 15px; display: flex; flex-direction: column; }
