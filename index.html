  <link rel="manifest" href="manifest.json">

  <style>

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow: hidden; }
    .hidden { display: none !important; }

    #authScreen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--primary); padding: 20px; }
    .auth-box { background: #fff; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }

    .auth-box button { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .auth-box .toggle { margin-top: 15px; color: #555; text-decoration: underline; cursor: pointer; font-size: 14px; font-weight: 500; }
